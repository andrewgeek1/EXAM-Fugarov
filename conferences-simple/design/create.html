<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Макет 390×844: Новая заявка</title>
  <link rel="stylesheet" href="../public/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="../public/css/style.css">
</head>

<body>
  <header class="header">
    <div class="container header-inner">
      <a class="logo" href="cabinet.html"><img src="../public/img/logo.jpg" alt="" width="30" height="30">Конференции<span>.РФ</span></a>
      <nav class="nav">
        <a href="cabinet.html">Мои заявки</a>
        <a href="login.html">Выйти</a>
      </nav>
    </div>
  </header>

  <main class="container page page-narrow">
    <h1>Новая заявка</h1>
    <p class="lead">Выберите зал, дату и способ оплаты</p>
    <form novalidate>
      <div class="field">
        <label for="room_id">Помещение</label>
        <select class="form-select" id="room_id">
          <option>Коворкинг «Точка сборки» (коворкинг)</option>
        </select>
      </div>
      <div class="field">
        <label for="event_date">Дата начала конференции</label>
        <input class="form-control" id="event_date" type="date" value="2026-11-20">
      </div>
      <div class="field">
        <label for="payment_method">Способ оплаты</label>
        <select class="form-select is-invalid" id="payment_method">
          <option>Выберите способ оплаты</option>
        </select>
        <div class="error">Выберите способ оплаты</div>
      </div>
      <button class="btn-main" type="button">Отправить</button>
    </form>
  </main>
</body>
</html>
